version: '3.8'

services:
  allure-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: allure-mcp-server
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-*}
      AUDIT_LOG_PATH: /app/audit
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-30}

    env_file:
      - .env

    volumes:
      - ./audit:/app/audit

    restart: unless-stopped

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
        reservations:
          cpus: '0.5'
          memory: 128M

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=allure-mcp"

    networks:
      - mcp-network

networks:
  mcp-network:
    driver: bridge
